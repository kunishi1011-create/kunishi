name: kunishi_expense
description: "KUNISHI経費精算 - 社内経費精算プロトタイプ"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状態管理
  provider: 6.1.5+1

  # 日付・数値フォーマット
  intl: ^0.20.2

  # ローカル永続化 (STEP2で使用)
  hive: 2.2.3
  hive_flutter: 1.1.0
  shared_preferences: 2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
